[package]
name = "marbleos-studio"
version = "1.0.0"
edition = "2021"
publish = false

[features]
default = ["desktop", "license-gate"]
desktop = ["dep:tauri", "dep:tauri-build"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
license-gate = []

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", optional = true , features = [] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry"] }

[[bin]]
name = "marbleos-studio"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
